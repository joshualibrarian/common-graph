// =============================================================================
// :language:english — English language support (WordNet import, lexicon generation)
//
// English-specific language data and importers.
// Depends on :core for Item/Language/Sememe infrastructure.
// =============================================================================

plugins {
    id 'java-library'
}

dependencies {

    // Core module (Item, Language, Sememe, etc.)
    api project(':core')

    // Language module — shared importer infrastructure + non-English language sememes
    api project(':language')

    // ICU for ULocale (exposed by Language.locale() in :core)
    api "com.ibm.icu:icu4j:${icu4jVersion}"

    // Abstract test bases (ItemTest, LanguageTest)
    testImplementation testFixtures(project(':core'))

    // -------------------------------------------------------------------------
    // Semantic Web (test only — for RDF/ontology validation)
    // -------------------------------------------------------------------------
    testImplementation "org.apache.jena:jena-arq:${jenaVersion}"
}
