// =============================================================================
// :bridges:parley — CG's native peer protocol.
//
// Parley is the protocol CG instances speak to each other.  Architecturally
// it's a bridge like any other (KERI, ActivityPub, SMTP): a protocol
// implementation that consumes Tunnels and produces frames for a Librarian.
// The "native" in "CG-native" is a property of the protocol design, not the
// module level.
//
// Current state: mechanical move from :core.  The Netty-pipeline rewrite
// (per docs/network-stack.md, migration step 4) lands after :bridges:tls
// validates the Tunnel-wrapper-via-EmbeddedChannel pattern.
// =============================================================================

plugins {
    id 'java-library'
}

dependencies {
    api project(':core')

    // Netty — ParleyFramer is a ByteToMessageDecoder; the pipeline runs in
    // an EmbeddedChannel adapted to the Tunnel SPI (same pattern as
    // :bridges:tls and :bridges:http).
    implementation "io.netty:netty-buffer:${nettyVersion}"
    implementation "io.netty:netty-common:${nettyVersion}"
    implementation "io.netty:netty-transport:${nettyVersion}"
    implementation "io.netty:netty-codec:${nettyVersion}"
}
