// =============================================================================
// :web — HTTP/WebSocket gateway for browser-based CG access
//
// Provides a web gateway that adapts the CG session protocol over WebSocket,
// serves a static JS web client, and will host ActivityPub federation endpoints.
// Depends on :core for session protocol, scene model, and vocabulary.
// =============================================================================

plugins {
    id 'java-library'
}

dependencies {

    // Core module (Librarian, SessionMessage, Scene, BridgeVocabulary)
    api project(':core')

    // Networking (Netty is 'implementation' in :core, not transitive)
    implementation "io.netty:netty-all:${nettyVersion}"
}
